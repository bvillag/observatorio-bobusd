# Vigilante: cada 30 min revisa que data/obs.json se haya actualizado.
# Si tiene mas de 40 min abre un issue con la etiqueta "caida" (GitHub envia un correo);
# si ya hay uno abierto, agrega un comentario; cuando los datos vuelven, lo cierra.
name: watchdog
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: watchdog
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX_MIN = 40;
            const { owner, repo } = context.repo;
            let gen = null, age = null, health = null;
            try {
              const f = await github.rest.repos.getContent({ owner, repo, path: 'data/obs.json', ref: 'main', mediaType: { format: 'raw' } });
              gen = JSON.parse(f.data).generated;
              age = (Date.now() - Date.parse(gen)) / 60000;
            } catch (e) { core.warning('no se pudo leer obs.json: ' + e.message); }
            try {
              const h = await github.rest.repos.getContent({ owner, repo, path: 'data/health.json', ref: 'main', mediaType: { format: 'raw' } });
              health = String(h.data);
            } catch (e) {}
            const stale = age === null || age > MAX_MIN;
            core.info(`generated=${gen} edad=${age?.toFixed(1)} min stale=${stale}`);

            try { await github.rest.issues.getLabel({ owner, repo, name: 'caida' }); }
            catch (e) { await github.rest.issues.createLabel({ owner, repo, name: 'caida', color: 'd73a4a', description: 'Datos del observatorio sin actualizar' }); }

            const open = (await github.rest.issues.listForRepo({ owner, repo, labels: 'caida', state: 'open' })).data;
            const hfmt = health ? '\n\nÚltimo `data/health.json`:\n```json\n' + health.slice(0, 3000) + '\n```' : '';
            if (stale) {
              const msg = `Los datos no se actualizan hace ${age === null ? '?' : Math.round(age)} min (último envío: ${gen ?? 'desconocido'}).${hfmt}`;
              if (open.length) await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: msg });
              else await github.rest.issues.create({ owner, repo, title: 'Observatorio: datos sin actualizar', labels: ['caida'], body: msg });
            } else {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `Datos de nuevo al día (envío ${gen}). Cierro el aviso.` });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
            }
